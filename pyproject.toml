[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "md-to-html"
version = "0.1.0"
description = "A Markdown to HTML converter with batch support, TOC generation, and syntax highlighting"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Xu Jiaqi", email = "jiaqixu12138@gmail.com" }
]
keywords = ["markdown", "html", "converter", "cli", "docs"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = [
    "click>=8.0.0",
    "markdown>=3.5",
    "pygments>=2.14.0",
]

[project.scripts]
md-to-html = "md_to_html.cli:main"
md2html = "md_to_html.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py38"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[project.urls]
Homepage = "https://github.com/Master-626/md-to-html"
Repository = "https://github.com/Master-626/md-to-html"
Issue-Tracker = "https://github.com/Master-626/md-to-html/issues"
