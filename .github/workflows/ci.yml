name: Tests and packaging
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        python: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - os: windows-2022
            python: '3.13'
          - os: macos-15
            python: '3.13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          check-latest: true
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: python -m pytest -q
      - run: md-to-html --help
      - run: md2html --help
  minimum-dependencies:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          check-latest: true
      - run: python -m pip install "click==8.0.0" "markdown==3.5" "pytest==7.0.0" .
      - run: python -m pytest -q
  package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          check-latest: true
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m pip install dist/*.whl
      - run: md-to-html --help
      - run: md2html --help
